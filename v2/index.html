<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)">
<title>JUJU Workspace</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="conn"></div>
<div id="app">
  <nav id="nav" aria-label="মূল নেভিগেশন">
    <div class="brand"><i>জু</i> JUJU</div>
    <button class="nitem on" data-v="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>চ্যাট</button>
    <button class="nitem" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>হিস্টরি</button>
    <button class="nitem" data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>প্রজেক্ট</button>
    <button class="nitem" data-v="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>ফাইল</button>
    <button class="nitem" data-v="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>টাস্ক</button>
    <div class="grow"></div>
    <button class="nitem" id="nPal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>কমান্ড (Ctrl K)</button>
  </nav>
  <main id="main">
    <header id="top">
      <span class="ttl">চ্যাট</span>
      <span class="chip" id="tModel">auto</span>
      <button class="ibtn" id="tCtx" aria-label="কনটেক্সট প্যানেল"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      <button class="ibtn" id="tTheme" aria-label="থিম"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="ibtn" id="tPal" aria-label="কমান্ড প্যালেট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="ibtn" id="tNew" aria-label="নতুন চ্যাট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <div id="view">
      <section class="view on" id="v-chat">
        <div id="msgs" role="log" aria-live="polite"></div>
        <button id="newMsg" aria-label="নতুন মেসেজে যান">↓ নতুন মেসেজ</button>
        <div id="composer">
          <div id="atts"></div>
          <div id="cbox">
            <button class="ibtn" id="attB" aria-label="ফাইল যুক্ত"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
            <textarea id="inp" rows="1" placeholder="যেকোনো কিছু জিজ্ঞেস করুন…  (Enter=পাঠান, Shift+Enter=নতুন লাইন)" aria-label="মেসেজ"></textarea>
            <button id="sendB" aria-label="পাঠান"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </div>
      </section>
      <section class="view" id="v-history">
        <div style="padding:12px clamp(12px,4vw,40px) 0;max-width:868px;margin:0 auto"><input id="hsearch" placeholder="চ্যাট সার্চ…" style="width:100%;padding:10px 14px;border:1px solid var(--c-line);border-radius:var(--r-2);background:var(--c-card);outline:none" oninput="Hist.search(this.value)"></div>
        <div class="lst"></div>
      </section>
      <section class="view" id="v-projects"><div class="lst"></div></section>
      <section class="view" id="v-files"><div class="lst"></div></section>
      <section class="view" id="v-tasks"><div class="lst"></div></section>
    </div>
  </main>
  <div id="ctxDiv" role="separator" aria-label="প্যানেল রিসাইজ"></div>
  <aside id="ctx" aria-label="কনটেক্সট প্যানেল">
    <div id="ctxTabs">
      <button class="ptab on" data-m="code">CODE</button>
      <button class="ptab" data-m="preview">PREVIEW</button>
      <button class="ptab" data-m="files">FILES</button>
      <button class="ptab" data-m="sources">SOURCES</button>
      <span style="flex:1"></span>
      <button class="ibtn" id="ctxClose" aria-label="প্যানেল বন্ধ">✕</button>
    </div>
    <div id="ctxBody"><div class="state" style="padding:30px 16px">কোড, প্রিভিউ, ফাইল ও সোর্স এখানে খুলবে।</div></div>
  </aside>
</div>
<nav id="bnav" aria-label="মোবাইল নেভিগেশন">
  <button data-v="chat" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>চ্যাট</button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>হিস্টরি</button>
  <button data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>প্রজেক্ট</button>
  <button data-v="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>ফাইল</button>
  <button id="bPal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>আরো</button>
</nav>
<div id="scrim"></div>
<div class="sheet" id="shSources"><div class="hd"><b>সোর্স</b><button class="ibtn" onclick="sheetCloseAll()">✕</button></div><div class="bd"></div></div>
<div class="sheet" id="shList"><div class="hd"><b>লিস্ট</b><button class="ibtn" onclick="sheetCloseAll()">✕</button></div><div class="bd"></div></div>
<div id="pal" role="dialog" aria-label="কমান্ড প্যালেট"><input placeholder="কমান্ড সার্চ… (Esc বন্ধ)"><div class="res"></div></div>
<div id="toasts"></div>
<input type="file" id="attInp" multiple hidden>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/md.js"></script>
<script src="js/views/panel.js"></script>
<script src="js/views/chat.js"></script>
<script src="js/views/history.js"></script>
<script src="js/shell.js"></script>
<script>$('#nPal').onclick=palOpen;$('#bPal').onclick=palOpen;</script>
</body>
</html>
