name: agent-runner
on:
  repository_dispatch:
    types: [agent-run]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run sandboxed script and post result
        env:
          SCRIPT_B64: ${{ github.event.client_payload.script_b64 }}
          RESULT_URL: ${{ github.event.client_payload.result_url }}
          RESULT_KEY: ${{ github.event.client_payload.result_key }}
          RUN_ID: ${{ github.run_id }}
          CODE: "0"
        run: |
          set -u
          mkdir -p sandbox && cd sandbox
          if [ -n "${SCRIPT_B64:-}" ]; then echo "$SCRIPT_B64" | base64 -d > run.sh; else echo 'echo "(no script)"' > run.sh; fi
          set +e
          timeout 100 bash run.sh > out.txt 2> err.txt
          CODE=$?
          set -e
          python3 - <<'PY'
          import json, os, urllib.request
          def rd(p, n=60000):
              try:
                  return open(p, encoding='utf-8', errors='replace').read()[:n]
              except Exception:
                  return ''
          body = json.dumps({
              'key': os.environ.get('RESULT_KEY', ''),
              'exit': int(os.environ.get('CODE', '1') or 1),
              'out': rd('out.txt'),
              'err': rd('err.txt', 20000),
              'run': os.environ.get('RUN_ID', '')
          }).encode()
          url = os.environ.get('RESULT_URL', '')
          if url:
              try:
                  req = urllib.request.Request(url, data=body, headers={'Content-Type': 'application/json'})
                  print('post:', urllib.request.urlopen(req, timeout=30).read()[:200])
              except Exception as e:
                  print('result post failed:', e)
          PY
